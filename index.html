<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#eaf4f3">
  <title>康复训练计时器</title>
  <style>
    :root {
      --pool: #087e8b; --pool-deep: #07324a; --pool-dark: #041f32;
      --water: #bde8e5; --foam: #f7fbf9; --tile: #eaf4f3;
      --signal: #f36a32; --signal-dark: #8c2d10;
      --ink: #08283c; --muted: #3e5d68; --line: #9bcac9; --danger: #a32d20;
      --shadow: 0 16px 38px rgba(4,31,50,.16), 0 4px 10px rgba(4,31,50,.1);
      --radius: 26px;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { min-height: 100%; background: var(--tile); }
    body {
      margin: 0; min-height: 100dvh; background: var(--tile); color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body::before, body::after {
      position: fixed; z-index: 0; top: 0; bottom: 0; width: 18px; content: "";
      background-color: var(--foam);
      background-image: radial-gradient(circle, var(--signal) 0 5px, transparent 5.5px);
      background-position: center 3px; background-size: 18px 36px;
      border-inline: 1px solid rgba(7,50,74,.14); pointer-events: none;
    }
    body::before { left: 0; } body::after { right: 0; }
    button { font: inherit; touch-action: manipulation; cursor: pointer; }
    button:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid var(--pool); outline-offset: 4px; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    h1, h2, h3, p { margin: 0; }
    .app-shell {
      position: relative; z-index: 1; width: min(100% - 64px, 920px); margin: 0 auto;
      padding: max(24px, env(safe-area-inset-top)) 0 max(22px, env(safe-area-inset-bottom));
    }
    .site-header { display: flex; align-items: baseline; justify-content: space-between; gap: 24px; padding: 0 4px 22px; border-bottom: 1px solid var(--line); }
    .site-header h1 { max-width: 100%; font: 700 clamp(2rem,5vw,3.45rem)/.98 "Kaiti SC", STKaiti, KaiTi, serif; letter-spacing: -.04em; text-wrap: balance; }
    main { padding: 20px 0 24px; }
    .plan-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; padding: 5px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--foam); }
    .plan-tab { flex: 1 1 0; min-width: 0; min-height: 52px; padding: 10px 12px; border: 0; border-radius: var(--radius); background: transparent; color: var(--pool-deep); font-weight: 700; line-height: 1.4; }
    .plan-tab[aria-selected="true"] { background: var(--pool-deep); color: var(--foam); }
    .plan-tab:hover:not([aria-selected="true"]) { background: var(--water); }
    .stage-progress { list-style: none; display: grid; grid-template-columns: repeat(5,minmax(0,1fr)); gap: 12px; margin: 0 0 26px; padding: 0; }
    .stage-point { min-width: 0; display: grid; justify-items: center; gap: 7px; text-align: center; color: var(--muted); }
    .stage-number { display: grid; place-items: center; width: 44px; height: 44px; border: 1px solid #659da0; border-radius: 50%; background: var(--foam); font-weight: 800; font-size: 1.2rem; }
    .stage-point[data-state="current"] .stage-number { background: var(--signal); border-color: var(--signal-dark); color: var(--pool-dark); }
    .stage-point[data-state="complete"] .stage-number { background: var(--pool); border-color: var(--pool); color: white; }
    .stage-label { font-size: .88rem; font-weight: 700; line-height: 1.45; }
    .stage-status { font-size: .75rem; }
    .start-button { position: relative; display: grid; width: 100%; min-height: 150px; overflow: hidden; place-items: center; padding: 24px; border: 0; border-radius: var(--radius); background: var(--signal); box-shadow: var(--shadow); color: var(--pool-dark); isolation: isolate; transition: transform 220ms cubic-bezier(.16,1,.3,1); }
    .start-button::before { position: absolute; z-index: -1; right: -52px; bottom: -66px; width: 210px; height: 210px; border: 28px solid rgba(247,251,249,.24); border-radius: 50%; content: ""; }
    .start-button:hover { transform: translateY(-3px); } .start-button:active { transform: translateY(1px); }
    .start-inner { display: flex; align-items: center; justify-content: center; gap: 24px; }
    .start-icon { width: 78px; height: 52px; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 5; }
    .start-label { font: 700 clamp(2.5rem,6vw,4rem)/1 "Kaiti SC", STKaiti, KaiTi, serif; letter-spacing: -.04em; }
    .routine-details { margin-top: 12px; color: var(--muted); line-height: 1.8; }
    summary { cursor: pointer; font-weight: 700; padding-block: 12px; }
    .routine-details ol { padding-left: 24px; margin: 8px 0; }
    .routine-details li { margin-bottom: 12px; }
    .running-panel { display: grid; gap: 20px; }
    .exercise-heading { font-size: 1.4rem; line-height: 1.5; overflow-wrap: anywhere; }
    .exercise-meta { margin-top: 6px; color: var(--muted); line-height: 1.6; }
    .scoreboard { position: relative; display: grid; grid-template-columns: minmax(180px,.8fr) minmax(240px,1fr); min-height: 300px; overflow: hidden; border-radius: var(--radius); background: var(--pool-deep); box-shadow: var(--shadow); color: var(--foam); }
    .scoreboard::after { position: absolute; right: -48px; bottom: -48px; width: 172px; height: 172px; border: 28px solid rgba(189,232,229,.12); border-radius: 50%; content: ""; pointer-events: none; }
    .running-panel.reveal .scoreboard { animation: scoreboard-in 500ms cubic-bezier(.16,1,.3,1) both; }
    .interval-state { display: flex; flex-direction: column; justify-content: space-between; gap: 24px; padding: 32px; background: var(--pool-dark); }
    .phase-name { color: var(--water); font: 700 2.7rem/1.15 "Kaiti SC", STKaiti, KaiTi, serif; letter-spacing: -.04em; }
    .position-copy { color: #d9eeee; font-size: 1.1rem; font-weight: 700; line-height: 1.5; }
    .clock-field { display: grid; align-content: center; justify-items: center; min-width: 0; padding: 36px 24px; text-align: center; }
    .countdown { font: 800 6rem/.9 "Avenir Next Condensed", "DIN Condensed", "Arial Narrow", sans-serif; font-variant-numeric: tabular-nums; letter-spacing: -.04em; }
    .countdown-unit { margin-top: 18px; color: var(--water); font-size: .92rem; font-weight: 800; }
    .next-cue { margin-top: 16px; color: #d9eeee; font-size: .95rem; line-height: 1.6; }
    .clock-field .control { position: relative; z-index: 1; margin-top: 20px; }
    .clock-field .control:focus-visible { outline-color: var(--foam); }
    .scoreboard[data-state="ready"] .countdown { font-size: 3rem; }
    .lane-progress { display: grid; grid-template-columns: auto 1fr; gap: 12px 16px; align-items: center; padding: 4px; }
    .lane-label { color: var(--muted); font-size: .82rem; font-weight: 800; white-space: nowrap; }
    .lane-cells { display: grid; grid-template-columns: repeat(6,minmax(0,1fr)); gap: 7px; }
    .lane-cell { height: 12px; border: 1px solid #659da0; border-radius: 999px; background: var(--foam); }
    .lane-cell[data-state="complete"] { border-color: var(--pool); background: var(--pool); }
    .lane-cell[data-state="active"] { border-color: var(--signal-dark); background: var(--signal); transform: scaleY(1.5); }
    .running-actions, .running-controls { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; }
    .running-actions { justify-content: space-between; }
    .sound-controls { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
    .audio-status { color: var(--danger); font-size: .9rem; line-height: 1.6; }
    .control { min-height: 52px; padding: 12px 22px; border: 1px solid var(--pool); border-radius: 999px; font-weight: 700; line-height: 1.5; background: var(--water); color: var(--pool-dark); }
    .control:hover { background: #d7f3f1; border-color: var(--pool-deep); }
    .control:active { transform: translateY(1px); }
    .control.primary { background: var(--signal); border-color: var(--signal-dark); }
    .control.primary:hover { background: #fa8454; }
    .control.danger { background: var(--foam); color: var(--danger); border-color: #6e9da0; }
    .control.danger:hover { background: #fff3f0; border-color: var(--danger); }
    .notice { line-height: 1.65; }
    .notice { padding: 12px 0; color: var(--danger); font-weight: 700; }
    .reset-confirm { border-top: 1px solid var(--line); padding-top: 16px; }
    .reset-confirm p { margin-bottom: 12px; line-height: 1.6; }
    .calendar-section { border-top: 1px solid var(--line); padding-top: 26px; margin-bottom: 30px; }
    .calendar-top { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px 20px; }
    .calendar-top h2 { font-size: 1.35rem; }
    .calendar-top p { color: var(--muted); font-size: .95rem; line-height: 1.6; }
    .calendar-nav { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 18px 0 12px; }
    .calendar-nav .control { min-height: 44px; padding: 8px 14px; font-size: .9rem; }
    .month-title { font-size: 1.15rem; text-align: center; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7,minmax(0,1fr)); gap: 6px; }
    .weekday { color: var(--muted); font-size: .85rem; padding: 8px 0; text-align: center; }
    .history-editor { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 24px; }
    .history-editor input { min-width: 0; max-width: 100%; color: var(--ink); background: var(--foam); font: inherit; }
    .calendar-day[aria-pressed="true"] { box-shadow: inset 0 -3px var(--pool-dark); }
    .calendar-day:not(:disabled):hover { outline: 2px solid var(--pool); outline-offset: -2px; }
    .calendar-day { background: transparent; color: inherit; min-height: 58px; padding: 7px 2px; display: grid; justify-items: center; align-content: center; gap: 3px; border-radius: 8px; border: 1px solid transparent; font-variant-numeric: tabular-nums; }
    .calendar-day[data-complete="true"] { background: var(--pool); color: white; }
    .calendar-day[aria-current="date"] { border: 2px solid var(--pool-dark); }
    .calendar-day small { font-size: .7rem; line-height: 1.3; }
    .page-footer { display: grid; gap: 10px; padding: 18px 4px 0; border-top: 1px solid var(--line); }
    .background-reminder { font-size: .95rem; font-weight: 700; line-height: 1.6; }
    .background-reminder strong { color: var(--signal-dark); }
    .local-note { font-size: .86rem; line-height: 1.65; color: var(--muted); }
    .debug-badge { margin-bottom: 16px; padding: 10px 14px; border: 1px solid var(--pool); color: var(--pool-deep); font-weight: 700; line-height: 1.6; }
    @keyframes scoreboard-in {
      from { clip-path: inset(0 100% 0 0 round var(--radius)); filter: blur(7px); transform: translateX(-20px); }
      to { clip-path: inset(0 0 0 0 round var(--radius)); filter: blur(0); transform: translateX(0); }
    }
    @media (max-width: 700px) {
      body::before, body::after { width: 10px; background-size: 10px 24px; background-image: radial-gradient(circle,var(--signal) 0 3px,transparent 3.5px); }
      .app-shell { width: calc(100% - 40px); padding-top: max(18px,env(safe-area-inset-top)); }
      .site-header { gap: 12px; align-items: center; padding-bottom: 16px; }
      .site-header h1 { font-size: 1.85rem; }
      .stage-progress { gap: 5px; margin-bottom: 22px; }
      .stage-number { width: 38px; height: 38px; }
      .stage-label { font-size: .75rem; } .stage-status { font-size: .7rem; }
      .start-button { min-height: 120px; }
      .start-icon { width: 44px; height: 36px; }
      .start-inner { gap: 14px; }
      .start-label { font-size: 2.4rem; }
      .scoreboard { grid-template-columns: 1fr; min-height: 0; }
      .interval-state { display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: center; padding: 18px; gap: 10px; }
      .phase-name { font-size: 2rem; }
      .position-copy { max-width: 9em; text-align: right; font-size: .95rem; }
      .scoreboard[data-state="ready"] .interval-state { display: block; }
      .scoreboard[data-state="ready"] .position-copy { display: none; }
      .clock-field { padding: 26px 22px; }
      .countdown { font-size: 5.5rem; }
      .exercise-heading { font-size: 1.15rem; }
      .running-controls { width: 100%; }
      .control { padding-inline: 18px; }
      .calendar-day { min-height: 54px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="site-header">
      <h1>康复训练计时器</h1>
    </header>
    <main>
      <p class="debug-badge" id="debugBadge" hidden></p>
      <div class="plan-tabs" role="tablist" aria-label="训练计划">
        <button class="plan-tab" id="originalTab" type="button" role="tab" aria-selected="true" aria-controls="planContent" tabindex="0">原计划</button>
        <button class="plan-tab" id="jointTab" type="button" role="tab" aria-selected="false" aria-controls="planContent" tabindex="-1">下肢关节居家训练</button>
      </div>
      <div id="planContent" role="tabpanel" aria-labelledby="originalTab">
      <ol class="stage-progress" id="stageProgress" aria-label="五项训练进度，仅展示，不可跳项"></ol>
      <section id="idlePanel" aria-label="开始训练">
          <button class="start-button" id="startButton" type="button">
            <span class="start-inner">
              <svg class="start-icon" viewBox="0 0 90 56" aria-hidden="true"><path d="M4 29h10l6-17 10 34 10-27 10 20 8-12h28" fill="none"/></svg>
              <span class="start-label">开始训练</span>
            </span>
          </button>
      </section>
      <section class="running-panel" id="runningPanel" aria-label="当前训练" hidden>
        <div><h2 class="exercise-heading" id="exerciseName"></h2><p class="exercise-meta" id="exerciseMeta"></p></div>
        <div class="scoreboard">
          <div class="interval-state">
            <p class="phase-name" id="phaseName"></p>
            <p class="position-copy" id="positionCopy"></p>
          </div>
          <div class="clock-field">
            <p class="countdown" id="countdown"></p><p class="countdown-unit" id="countdownUnit"></p><p class="next-cue" id="nextCue"></p>
            <button class="control primary" id="continueButton" type="button" hidden>继续训练</button>
          </div>
        </div>
        <div class="lane-progress" id="laneProgress" aria-label="当前项组次进度"></div>
        <div class="running-actions">
          <div class="running-controls">
            <button class="control" id="pauseButton" type="button" hidden>暂停</button>
            <button class="control" id="skipPrepButton" type="button" hidden>跳过准备</button>
            <button class="control" id="skipRestButton" type="button" hidden>跳过休息</button>
            <button class="control primary" id="completeButton" type="button" hidden>完成</button>
            <button class="control danger" id="resetButton" type="button">结束 / 重新开始</button>
            <button class="control" id="retrySaveButton" type="button" hidden>重试保存打卡</button>
          </div>
        </div>
        <div class="reset-confirm" id="resetConfirm" hidden>
          <p>结束本次？未完成不打卡，历史保留。</p>
          <div class="running-controls"><button class="control danger" id="confirmResetButton" type="button">确认结束本次</button><button class="control" id="cancelResetButton" type="button">保留进度</button></div>
        </div>
      </section>
      <div class="sound-controls" aria-label="声音控制">
        <button class="control" id="soundButton" type="button" aria-pressed="true">声音：开</button>
        <button class="control" id="testSoundButton" type="button">试听声音</button>
        <p class="audio-status" id="audioStatusText" role="status" hidden></p>
      </div>
      <audio id="cueAudio" preload="auto" playsinline src="audio/prepare.wav" hidden></audio>
      <details class="routine-details"><summary>动作详情</summary><ol id="routineList"></ol></details>
      <p class="notice" id="runtimeMessage" role="status" hidden></p>
      <p class="notice" id="compatibilityMessage" role="status" hidden></p>
      <p class="notice" id="storageMessage" role="status" hidden></p>
      </div>
    </main>
    <section class="calendar-section" aria-labelledby="calendarTitle">
      <div class="calendar-top"><h2 id="calendarTitle">训练日历</h2><p id="weeklySummary"></p></div>
      <div class="calendar-nav">
        <button class="control" id="prevMonth" type="button" aria-label="上一个月">上月</button>
        <h3 class="month-title" id="monthTitle" aria-live="polite"></h3>
        <button class="control" id="nextMonth" type="button" aria-label="下一个月">下月</button>
      </div>
      <p class="local-note">点击日期可补记或取消完成，仅修改本地记录。</p>
      <div class="calendar-grid" id="calendarGrid" role="group" aria-label="本月日期"></div>
      <div class="history-editor">
        <label for="historyDate">编辑日期</label>
        <input class="control" id="historyDate" type="date" required>
        <button class="control" id="markDate" type="button">标记完成</button>
        <button class="control danger" id="unmarkDate" type="button">取消完成</button>
      </div>
      <p class="local-note" id="historyStatus" role="status"></p>
    </section>
    <footer class="page-footer">
      <p class="background-reminder"><strong>支持后台连续音轨。</strong>锁屏能否播放取决于系统；首次请试听验证，项间仍需手动继续。</p>
      <p class="local-note">记录仅存本浏览器，清除网站数据会丢失。</p>
    </footer>
  </div>
  <script id="rehab-core">
    /* Dependency-free domain code. Tests execute this exact script, not a copy. */
    globalThis.RehabCore = (() => {
      "use strict";
      const VERSION = 1;
      const PROGRAM = "five-stage-v1";
      const JOINT_PROGRAM = "lower-limb-joints-v1";
      const stages = [
        { name: "俯卧左大腿屈膝后伸抗阻静力训练", equipment: "1 kg", short: "大腿后伸" },
        { name: "左侧直抬腿", equipment: "1 kg", short: "直抬腿" },
        { name: "左髋内收抗阻静力训练", equipment: "弹力带 15 磅", short: "髋内收" },
        { name: "左踝内翻训练", equipment: "弹力带 15 磅", short: "踝内翻" },
        { name: "左小腿踮脚静力训练 → 左小腿拉伸", equipment: "", short: "踮脚/拉伸" }
      ];
      const makePlan = () => {
        const plan = [{ stage: 0, kind: "prep", seconds: 30 }];
        for (let stage = 0; stage < 4; stage++) {
          for (let group = 1; group <= 2; group++) {
            for (let rep = 1; rep <= 6; rep++) {
              plan.push({ stage, group, rep, kind: "work", seconds: 15 });
              if (rep < 6) plan.push({ stage, group, rep, kind: "rest", seconds: 5 });
            }
            if (group === 1) plan.push({ stage, group, rep: 6, kind: "group-rest", seconds: 60 });
          }
        }
        for (let round = 1; round <= 4; round++) {
          plan.push({ stage: 4, round, kind: "work", action: "左小腿踮脚静力训练", seconds: 30 });
          plan.push({ stage: 4, round, kind: "stretch", action: "左小腿拉伸", seconds: 30 });
        }
        return plan.map((item, index) => Object.freeze({ ...item, index }));
      };
      const plan = Object.freeze(makePlan());
      const jointStages = Object.freeze([
        { name: "双侧屈膝抗阻静力训练", equipment: "弹力带 10 到 15 磅", short: "屈膝抗阻" },
        { name: "双侧屈膝屈髋维持训练", equipment: "", short: "屈膝屈髋" },
        { name: "双髋外展抗阻静力训练", equipment: "20 磅弹力环", short: "髋外展" },
        { name: "双髋内收抗阻静力训练", equipment: "仰卧内收腿夹球，球径 20 到 25 厘米", short: "髋内收" },
        { name: "双侧抬腿跨障碍", equipment: "", short: "抬腿跨障碍" }
      ]);
      const jointPlan = Object.freeze((() => {
        const items = [{ stage: 0, kind: "prep", seconds: 30 }];
        for (let stage = 0; stage < 4; stage++) {
          for (let group = 1; group <= 2; group++) for (let rep = 1; rep <= 6; rep++) {
            items.push({ stage, group, rep, kind: "work", seconds: 15 });
            if (group === 1 || rep < 6) items.push({ stage, group, rep, kind: "rest", seconds: 5 });
          }
          items.push({ stage, kind: "stage-rest", seconds: 60 });
        }
        for (let group = 1; group <= 2; group++) items.push({ stage: 4, group, kind: "manual", seconds: 0 });
        return items.map((item,index) => Object.freeze({ ...item, index }));
      })());
      const programs = Object.freeze({
        [PROGRAM]: { stages, plan },
        [JOINT_PROGRAM]: { stages: jointStages, plan: jointPlan }
      });
      const localDate = date => `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,"0")}-${String(date.getDate()).padStart(2,"0")}`;
      const validDate = value => {
        if (typeof value !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
        const [y,m,d] = value.split("-").map(Number);
        return localDate(new Date(y,m-1,d,12)) === value;
      };
      const validId = id => typeof id === "string" && /^[\w-]{8,100}$/.test(id);
      const validRecord = r => Boolean(r && r.version === VERSION && validId(r.id) && validDate(r.date) && typeof r.finishedAt === "string" && Number.isFinite(Date.parse(r.finishedAt)));
      const monthCells = (year, month, records, today) => {
        const marked = new Set(records.map(r => r.date));
        const first = new Date(year,month,1,12);
        const cells = Array((first.getDay()+6)%7).fill(null);
        const count = new Date(year,month+1,0,12).getDate();
        for (let day = 1; day <= count; day++) {
          const date = localDate(new Date(year,month,day,12));
          cells.push({ day, date, complete: marked.has(date), today: date === localDate(today) });
        }
        return cells;
      };

          if (clock()-at > 150) { pause("声音延迟，已暂停。",true); return; }
          if (speaker.job) {
            speaker.cancel(); speaker.failed = true;
            soundMessage("语音中断，请重试声音。"); log("media-overrun",{index}); return;
          }
          speaker.play("beep");
          log("beep-request",{index,zero:at,lateMs:clock()-at});
        },Math.max(0,at-clock()));
      }
      function checkpoint(force=false) {
        const snap = engine.snapshot();
        const key = snap ? `${snap.id}:${snap.index}:${snap.state}:${Math.ceil(snap.remaining/unitMs)}` : "idle";
        if (force || key !== lastSave) { if (store.saveProgress(snap)) lastSave = key; }
      }
      function finishSave() {
        // Persist terminal intent first. A crash between writes can safely retry by ID.
        store.saveProgress(engine.snapshot());
        savedCompletion = store.complete(engine.completion);
        if (savedCompletion) {
          store.saveProgress(null);
          history = store.history();
        }
        renderCalendar(); render();
      }
      function renderCalendar() {
        const today = new Date();
        text("monthTitle",`${month.getFullYear()} 年 ${month.getMonth()+1} 月`);
        text("calendarTitle",`${program===PROGRAM?"原计划":"下肢关节居家训练"} · 训练日历`);
        text("weeklySummary",`本周 ${weeklyCount(history,today)} 次${program===PROGRAM?" · 每周 3-4 次":""}`);
        const completed = history.some(r => r.date === selectedDate);
        text("historyStatus",`${selectedDate} · ${completed ? "已完成" : "未标记完成"}`);
        $("markDate").disabled = completed; $("unmarkDate").disabled = !completed;
        $("historyDate").max = localDate(today);
        const grid = $("calendarGrid"); grid.replaceChildren();
        for (const day of ["一","二","三","四","五","六","日"]) {
          const el = document.createElement("span"); el.className = "weekday"; el.textContent = day; el.setAttribute("aria-hidden","true"); grid.append(el);
        }
        for (const cell of monthCells(month.getFullYear(),month.getMonth(),history,today)) {
          const el = document.createElement(cell ? "button" : "div");
          if (!cell) { el.setAttribute("aria-hidden","true"); grid.append(el); continue; }
          el.type = "button"; el.disabled = cell.date > localDate(today);
          el.className = "calendar-day"; el.dataset.complete = cell.complete;
          el.setAttribute("aria-pressed",String(cell.date === selectedDate));
          el.addEventListener("click",() => {
            selectedDate = cell.date; $("historyDate").value = selectedDate; renderCalendar();
            $("historyDate").focus();
          });
          el.setAttribute("aria-label",`${cell.date}${cell.today?"，今天":""}${cell.complete?"，已完成训练":"，无完整打卡"}`);
          if (cell.today) el.setAttribute("aria-current","date");
          const number = document.createElement("span"); number.textContent = cell.day; el.append(number);
          if (cell.today || cell.complete) { const label = document.createElement("small"); label.textContent = cell.today ? (cell.complete?"今天·完成":"今天") : "完成"; el.append(label); }
          grid.append(el);
        }
      }
      function stagePoints() {
        const active = engine.state === "idle" ? 0 : engine.interval.stage;
        [...$("stageProgress").children].forEach((el,i) => {
          const state = engine.state === "finished" || i<active ? "complete" : i===active ? "current" : "pending";
          el.dataset.state = state;
          if (state === "current") el.setAttribute("aria-current","step"); else el.removeAttribute("aria-current");
          const label = {complete:"已完成",current:engine.state==="idle"?"待开始":"当前项",pending:"待进行"}[state];
          el.querySelector(".stage-status").textContent = label;
          el.setAttribute("aria-label",`${i+1}，${stages[i].name}${stages[i].equipment?`，${stages[i].equipment}`:""}，${label}`);
        });
      }
      function lanes() {
        const item = engine.interval, key = `${engine.index}:${engine.state}`;
        if (lastLane === key) return; lastLane = key;
        const root = $("laneProgress"); root.replaceChildren();
        const groups = item.stage===4 && program===PROGRAM ? [1] : [1,2];
        for (const group of groups) {
          const label = document.createElement("span"); label.className = "lane-label"; label.textContent = item.stage===4 && program===PROGRAM?"四轮交替":`第 ${group} 组`;
          const cells = document.createElement("div"); cells.className = "lane-cells";
          const works = plan.filter(p => p.stage===item.stage && ((program===PROGRAM && item.stage===4) || (p.group===group && ["work","manual"].includes(p.kind))));
          cells.style.gridTemplateColumns = `repeat(${works.length},minmax(0,1fr))`;
          for (const work of works) {
            const cell = document.createElement("span"); cell.className = "lane-cell"; cell.setAttribute("aria-hidden","true");
            cell.dataset.state = engine.state === "finished" || work.index<engine.index ? "complete" : work.index===engine.index && !["ready","cue"].includes(engine.state)?"active":"pending";
            cells.append(cell);
          }
          root.append(label,cells);
        }
      }
      function nextText() {
        const item = engine.interval, next = plan[engine.index+1];
        if (!next) return "接着：完成";
        if (next.stage !== item.stage) return "接着：下一项就位";
        if (item.kind === "prep") return `接着：${stages[0].short}`;
        if (program === PROGRAM && next.stage===4) return `接着：${next.kind === "stretch" ? "拉伸" : "踮脚"}`;
        return `接着：${next.kind === "stage-rest" ? "节间休息" : next.kind === "group-rest" ? "组间休息" : next.kind === "rest" ? "休息" : next.kind === "manual" ? "点完成" : "训练"}`;
      }
      function render() {
        const state = engine.state, item = engine.interval;
        $("idlePanel").hidden = state !== "idle"; $("runningPanel").hidden = state === "idle";
        stagePoints();
        showMessage("runtimeMessage",state === "paused" ? engine.reason : "");
        if (state === "idle") return;
        text("exerciseName",`${item.stage+1}. ${stages[item.stage].name}`);
        text("exerciseMeta",stages[item.stage].equipment);
        $("exerciseMeta").hidden = !stages[item.stage].equipment;
        const phase = program===PROGRAM && item.stage===4 && item.kind==="work" ? "踮脚" : { prep:"准备",work:"训练",rest:"休息","group-rest":"组间休息","stage-rest":"节间休息",manual:"训练",stretch:"拉伸" }[item.kind];
        document.querySelector(".scoreboard").dataset.state = state;
        $("positionCopy").hidden = ["ready","finished"].includes(state);
        text("phaseName",state==="ready"?"下一项就位":state==="paused"?"已暂停":state==="cue"?"准备开始":state==="finished"?"训练完成":phase);
        text("positionCopy",state==="finished"?(program===PROGRAM?"第 4/4 轮拉伸已完成":"第 2/2 组已完成"):item.kind==="manual"?`第 ${item.group}/2 组 · 8 到 10 次`:program===PROGRAM && item.stage===4?`第 ${item.round}/4 轮`:item.kind==="prep"?"第一项尚未开始":item.kind==="stage-rest"?"下一节即将开始":`第 ${item.group}/2 组 · 第 ${item.rep}/6 次${item.kind==="rest" || item.kind==="group-rest"?"已完成":""}`);
        text("countdown",state==="finished" && item.kind==="manual" ? "完成" : item.kind==="manual" ? "8–10" : String(Math.max(0,Math.ceil(engine.remaining/unitMs-1e-6))));
        text("countdownUnit",state==="ready" && item.kind==="manual"?"次 / 组 · 确认后开始":state==="ready"?"秒 · 确认后开始":state==="finished"?(savedCompletion?"打卡已保存":"打卡尚未保存"):item.kind==="manual"?"次 / 组 · 不计时":state==="cue"?"秒 · 提示音后计时":"秒");
        $("nextCue").hidden = ["finished","ready","paused"].includes(state);
        text("nextCue",nextText());
        $("continueButton").hidden = !["paused","ready"].includes(state);
        text("continueButton",state==="ready"?"准备好了，开始下一项":"继续训练");
        $("pauseButton").hidden = !["running","cue","manual"].includes(state);
        $("completeButton").hidden = state!=="manual";
        $("skipPrepButton").hidden = state!=="running" || item.kind!=="prep";
        $("skipRestButton").hidden = state!=="running" || item.kind!=="group-rest";
        $("retrySaveButton").hidden = state!=="finished" || savedCompletion;
        lanes();
      }
      function pause(reason="", conservative=false) {
        if (activeTrack) {
          syncTrack();
          resumePosition = trackMedia.currentTime;
          resumeStage = trackStage;
        }
        if (!engine.pause(conservative && engine.state==="running"?engine.lastNow:clock())) return;
        engine.reason = reason; clearAudio(); mediaState("paused"); releaseWake(); checkpoint(true); render();
        log("paused",{index:engine.index,remaining:engine.remaining,reason});
      }
      async function enterCue(resuming=false, gesture=false) {
        if (!isDebug) {
          if (engine.interval.kind === "manual") {
            clearAudio(); playbackSession(); engine.state = "manual";
            checkpoint(true); render(); speak(cueFor(engine.interval,true,program),gesture); return;
          }
          if (resuming) {
            if (!Number.isFinite(resumePosition)) {
              const track = stageTrack(engine.interval.stage,program);
              const entry = track.entries.find(e => e.index === engine.index);
              resumePosition = entry.end-engine.remaining/1000; resumeStage = engine.interval.stage;
            }
            clearAudio(); playbackSession();
            const token = generation, playing = speak(cueFor(engine.interval,true,program),gesture);
            render(); checkpoint(true); await playing;
            if (token!==generation || engine.state!=="cue") return;
          }
          startTrack(); return;
        }
        if (engine.interval.kind === "manual") {
          clearAudio(); engine.state = "manual"; checkpoint(true); render(); log("manual-start",{index:engine.index}); return;
        }
        clearAudio(); const token = generation;
        const item = engine.interval;
        if (gesture) playbackSession();
        // No await or asynchronous initialization before the first media.play in a click.
        const playing = speak(cueFor(item,!resuming,program),gesture);
        render(); checkpoint(true); requestWake(token);
        await playing;
        if (token!==generation || engine.state!=="cue") return;
        const zero = clock()+40;
        beep(zero,item.index); engine.arm(zero); checkpoint(true); render();
        log("interval-start",{index:item.index,kind:item.kind,stage:item.stage,zero});
        timer = setTimeout(pump,Math.max(8,zero-clock()+8));
      }
      function pump() {
        clearTimeout(timer);
        if (engine.state!=="running") return;
        const now = clock();
        const result = engine.tick(now,new Date());
        if (result === "late") { clearAudio(); releaseWake(); checkpoint(true); render(); log("late-paused"); return; }
        if (result === "finished") {
          clearAudio(); releaseWake(); finishSave(); speak("complete"); log("session-finished",{id:engine.id,date:engine.completion.date,saved:savedCompletion}); return;
        }
        if (result === "ready") {
          clearAudio(); releaseWake(); checkpoint(true); render();
          speak("next");
          log("stage-ready",{stage:engine.interval.stage}); return;
        }
        if (result === "cue") { enterCue(); return; }
        if (result === "interval") {
          if (beepIndex !== engine.index) beep(engine.deadline-engine.interval.seconds*unitMs,engine.index);
          log("interval-start",{index:engine.index,kind:engine.interval.kind,stage:engine.interval.stage,zero:engine.deadline-engine.interval.seconds*unitMs});
          nextCueIndex = -1; pendingBeep = null;
        }
        const next = plan[engine.index+1];
        const automatic = next && next.stage===engine.interval.stage && engine.interval.kind!=="prep";
        if (automatic) {
          const cue = cueFor(next,false,program);
          // Allow media startup plus the 250ms heartbeat before the fixed boundary.
          // Production observed a 718ms decoder start even with a preloaded local Blob.
          const lead = isDebug?0:cues[cue][1]+1000;
          if (engine.remaining<=lead && nextCueIndex!==next.index) { nextCueIndex=next.index; speak(cue); }
          // Only arm the immediately upcoming beep close to its boundary.
          if (engine.remaining<=Math.min(350,unitMs) && beepIndex!==next.index) {
            beepIndex=next.index; pendingBeep=engine.deadline; beep(engine.deadline,next.index);
          }
        }
        render(); checkpoint();
        // Second-boundary display ticks with a bounded foreground heartbeat, never RAF/count-based elapsed time.
        const toSecond = engine.remaining%unitMs || unitMs;
        timer = setTimeout(pump,Math.max(8,Math.min(250,toSecond,engine.remaining)));
      }
      $("startButton").addEventListener("click",() => {
        const id = window.crypto?.randomUUID?.() || `session-${Date.now()}-${Math.random().toString(36).slice(2)}`;
        if (!engine.start(id)) return;
        showMessage("runtimeMessage",""); savedCompletion=false;
        $("runningPanel").classList.add("reveal"); enterCue(false,true);
      });
      $("continueButton").addEventListener("click",() => {
        const resuming = engine.state==="paused";
        if (!engine.continue()) return;
        $("resetConfirm").hidden=true; enterCue(resuming,true);
      });
      $("pauseButton").addEventListener("click",() => pause());
      $("completeButton").addEventListener("click",() => {
        const result = engine.completeManual(new Date());
        if (!result) return;
        if (result === "finished") { finishSave(); speaker.cancel(); speak("complete"); log("session-finished",{id:engine.id,saved:savedCompletion}); }
        else { checkpoint(true); render(); speaker.cancel(); speak(cueFor(engine.interval,true,program)); log("manual-start",{index:engine.index}); }
      });
      function testSound() {
        pause(); speaker.cancel(); clearTimeout(beepTimer); beepTimer = null;
        soundEnabled = true; $("soundButton").setAttribute("aria-pressed","true"); text("soundButton","声音：开");
        playbackSession(); trackMedia.muted = false; speaker.play("test",true);
      }
      $("testSoundButton").addEventListener("click",testSound);
      $("soundButton").addEventListener("click",() => {
        if (!soundEnabled) { testSound(); return; }
        soundEnabled = false; trackMedia.muted = true;
        if (!activeTrack) speaker.cancel();
        clearTimeout(beepTimer); beepTimer = null;
        $("soundButton").setAttribute("aria-pressed","false"); text("soundButton","声音：关");
        soundMessage(""); log("sound-off");
      });
      for (const [id,kind] of [["skipPrepButton","prep"],["skipRestButton","group-rest"]]) {
        $(id).addEventListener("click",() => {
          if (activeTrack) syncTrack();
          if (engine.skip(kind,clock())) { log("rest-skipped",{kind,index:engine.index}); enterCue(false,true); }
          else {
            clearAudio();
            if (engine.state==="cue") enterCue();
            else { if (engine.state==="running") pause("阶段已变化，请确认后继续。",true); checkpoint(true); render(); }
          }
        });
      }
      $("resetButton").addEventListener("click",() => {
        pause(); clearAudio(); $("resetConfirm").hidden=false; $("confirmResetButton").focus();
      });
      $("cancelResetButton").addEventListener("click",() => { $("resetConfirm").hidden=true; $("resetButton").focus(); });
      $("confirmResetButton").addEventListener("click",() => {
        clearAudio(); releaseWake(); engine.reset(); store.saveProgress(null); lastSave="";
        savedCompletion=false; $("resetConfirm").hidden=true; $("runningPanel").classList.remove("reveal");
        render(); log("reset"); $("startButton").focus();
      });
      $("retrySaveButton").addEventListener("click",() => { showMessage("storageMessage",""); finishSave(); });
      for (const [id,offset] of [["prevMonth",-1],["nextMonth",1]]) $(id).addEventListener("click",() => {
        month = new Date(month.getFullYear(),month.getMonth()+offset,1,12); renderCalendar();
      });
      $("historyDate").addEventListener("change",() => {
        if (!$("historyDate").checkValidity()) { $("historyDate").reportValidity(); return; }
        selectedDate = $("historyDate").value;
        const [y,m] = selectedDate.split("-").map(Number); month = new Date(y,m-1,1,12);
        renderCalendar();
      });
      for (const [id,completed] of [["markDate",true],["unmarkDate",false]]) $(id).addEventListener("click",() => {
        if (!$("historyDate").checkValidity()) { $("historyDate").reportValidity(); return; }
        selectedDate = $("historyDate").value;
        if (store.setDate(selectedDate,completed)) {
          history = store.history(); renderCalendar();
          text("historyStatus",`${selectedDate} · ${completed ? "已标记完成" : "已取消完成"}，已保存`);
        }
      });
      document.addEventListener("visibilitychange",() => {
        log("visibility",{hidden:document.hidden});
        if (document.hidden) {
          if (isDebug && engine.state !== "manual") pause("测试页面离开前台，已暂停。",true);
          checkpoint(true); releaseWake();
        } else {
          syncTrack();
          if (activeTrack && trackMedia.paused) pause("后台播放已中断，请确认后继续。");
          if (activeTrack) requestWake(generation);
          history = store.history(); renderCalendar(); render();
        }
      });
      window.addEventListener("pagehide",() => { pause("离开页面，已暂停。",true); clearAudio(); releaseWake(); });
      window.addEventListener("storage",e => { if ((e.key?.startsWith(`${prefix}:done:`) || e.key?.startsWith(`${prefix}:date:`))) { history=store.history(); renderCalendar(); } });
      function renderProgramDetails() {
        $("stageProgress").replaceChildren(); $("routineList").replaceChildren();
        stages.forEach((stage,i) => {
          const point = document.createElement("li"); point.className="stage-point";
          point.innerHTML=`<span class="stage-number">${i+1}</span><span class="stage-label"></span><span class="stage-status"></span>`;
          point.querySelector(".stage-label").textContent=stage.short; $("stageProgress").append(point);
          const line = document.createElement("li");
          line.textContent = program === PROGRAM
            ? `${stage.name}${stage.equipment?`，${stage.equipment}`:""}。${i<4?"15 秒训练 / 5 秒重复间休息，6 次 × 2 组；组间休息 60 秒。":"踮脚 30 秒接拉伸 30 秒为一轮，共 4 轮，无额外休息。"}`
            : `${stage.name}${stage.equipment?`，${stage.equipment}`:""}。${i<4?"每次 15 秒，休息 5 秒，6 次 × 2 组；两组之间休息 5 秒，节间休息 1 分钟。":"每组 8 到 10 次，共 2 组，逐组点击「完成」，不计时。"}`;
          $("routineList").append(line);
        });
      }
      renderProgramDetails();
      if (isTest) { $("debugBadge").hidden=false; text("debugBadge",isDebug?`隔离测试 · ${unitMs} ms/秒 · 无声音`:"隔离测试 · 真实秒长与声音"); }
      function restoreProgress() {
        const snapshot = store.loadProgress();
        if (snapshot !== null) {
          if (!engine.restore(snapshot)) showMessage("storageMessage","进度无法恢复，历史保留。");
          else {
            const existing = history.find(record => record.id===engine.id);
            if (existing) {
              engine.index=plan.length-1; engine.remaining=0; engine.state="finished"; engine.completion=existing;
              savedCompletion=true; store.saveProgress(null);
            } else if (engine.state==="finished") finishSave();
          }
        }
      }
      restoreProgress(); render(); renderCalendar();
      function chooseProgram(nextProgram) {
        if (program === nextProgram) return;
        // Stop and discard an unfinished attempt before changing which plan owns the screen.
        if (engine.state === "finished" && !savedCompletion) {
          showMessage("storageMessage","打卡尚未保存，请重试保存后切换计划。"); return;
        }
        if (engine.state !== "finished" && engine.state !== "idle" && !store.saveProgress(null)) {
          pause("进度未清除，请重试切换。",true); render(); return;
        }
        clearAudio(); releaseWake(); mediaState("paused");
        program = nextProgram; stages = programs[program].stages; plan = programs[program].plan;
        prefix = program === PROGRAM ? basePrefix : `${basePrefix}:joint`;
        store = new Store(storage,prefix,storageWarning); engine = new Engine(unitMs,program);
        history = store.history(); savedCompletion = false; lastSave = ""; lastLane = "";
        resumePosition = null; resumeStage = -1; $("resetConfirm").hidden = true;
        showMessage("storageMessage",""); showMessage("runtimeMessage","");
        $("runningPanel").classList.remove("reveal");
        for (const [id,selected] of [["originalTab",program===PROGRAM],["jointTab",program===JOINT_PROGRAM]]) {
          $(id).setAttribute("aria-selected",String(selected)); $(id).tabIndex=selected?0:-1;
        }
        $("planContent").setAttribute("aria-labelledby",program===PROGRAM?"originalTab":"jointTab");
        renderProgramDetails(); restoreProgress(); render(); renderCalendar();
        log("plan-selected",{program});
      }
      for (const [id,value] of [["originalTab",PROGRAM],["jointTab",JOINT_PROGRAM]]) {
        $(id).addEventListener("click",() => chooseProgram(value));
        $(id).addEventListener("keydown",event => {
          if (!["ArrowLeft","ArrowRight","Home","End"].includes(event.key)) return;
          event.preventDefault(); const target = event.key==="Home"?PROGRAM:event.key==="End"?JOINT_PROGRAM:program===PROGRAM?JOINT_PROGRAM:PROGRAM;
          chooseProgram(target); $(target===PROGRAM?"originalTab":"jointTab").focus();
        });
      }
      // Read-only observability: no bypass/complete hooks in either production or test mode.
      window.__rehabTimer = {
        get config() { return { debug:isDebug, test:isTest, unitMs, prefix, program, totalSeconds:plan.reduce((n,p)=>n+p.seconds,0) }; }, events,
        getPlan: () => plan.map(p=>({...p})),
        getState: () => ({ ...engine.snapshot(), runState:engine.state, savedCompletion, soundEnabled, mediaState:speaker.failed?"unavailable":$("cueAudio").paused?"paused":"playing", mediaJob:speaker.job?.key || null, pendingBeep, historyCount:history.length })
      };
    })();
  </script>
