<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#eaf4f3">
  <title>康复训练计时器</title>
  <style>
    :root {
      --pool: #087e8b; --pool-deep: #07324a; --pool-dark: #041f32;
      --water: #bde8e5; --foam: #f7fbf9; --tile: #eaf4f3;
      --signal: #f36a32; --signal-dark: #8c2d10;
      --ink: #08283c; --muted: #3e5d68; --line: #9bcac9; --danger: #a32d20;
      --shadow: 0 16px 38px rgba(4,31,50,.16), 0 4px 10px rgba(4,31,50,.1);
      --radius: 26px;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { min-height: 100%; background: var(--tile); }
    body {
      margin: 0; min-height: 100dvh; background: var(--tile); color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body::before, body::after {
      position: fixed; z-index: 0; top: 0; bottom: 0; width: 18px; content: "";
      background-color: var(--foam);
      background-image: radial-gradient(circle, var(--signal) 0 5px, transparent 5.5px);
      background-position: center 3px; background-size: 18px 36px;
      border-inline: 1px solid rgba(7,50,74,.14); pointer-events: none;
    }
    body::before { left: 0; } body::after { right: 0; }
    button { font: inherit; touch-action: manipulation; cursor: pointer; }
    button:focus-visible, summary:focus-visible { outline: 3px solid var(--pool); outline-offset: 4px; }
    button:disabled { opacity: .55; cursor: wait; }
    h1, h2, h3, p { margin: 0; }
    .app-shell {
      position: relative; z-index: 1; width: min(100% - 64px, 920px); margin: 0 auto;
      padding: max(24px, env(safe-area-inset-top)) 0 max(22px, env(safe-area-inset-bottom));
    }
    .site-header { display: flex; align-items: baseline; justify-content: space-between; gap: 24px; padding: 0 4px 22px; border-bottom: 1px solid var(--line); }
    .site-header h1 { max-width: 12ch; font: 700 clamp(2rem,5vw,3.45rem)/.98 "Kaiti SC", STKaiti, KaiTi, serif; letter-spacing: -.04em; text-wrap: balance; }
    main { padding: 28px 0 36px; }
    .stage-progress { list-style: none; display: grid; grid-template-columns: repeat(5,minmax(0,1fr)); gap: 12px; margin: 0 0 26px; padding: 0; }
    .stage-point { min-width: 0; display: grid; justify-items: center; gap: 7px; text-align: center; color: var(--muted); }
    .stage-number { display: grid; place-items: center; width: 44px; height: 44px; border: 1px solid #659da0; border-radius: 50%; background: var(--foam); font-weight: 800; font-size: 1.2rem; }
    .stage-point[data-state="current"] .stage-number { background: var(--signal); border-color: var(--signal-dark); color: var(--pool-dark); }
    .stage-point[data-state="complete"] .stage-number { background: var(--pool); border-color: var(--pool); color: white; }
    .stage-label { font-size: .88rem; font-weight: 700; line-height: 1.45; }
    .stage-status { font-size: .75rem; }
    .start-button { position: relative; display: grid; width: 100%; min-height: 150px; overflow: hidden; place-items: center; padding: 24px; border: 0; border-radius: var(--radius); background: var(--signal); box-shadow: var(--shadow); color: var(--pool-dark); isolation: isolate; transition: transform 220ms cubic-bezier(.16,1,.3,1); }
    .start-button::before { position: absolute; z-index: -1; right: -52px; bottom: -66px; width: 210px; height: 210px; border: 28px solid rgba(247,251,249,.24); border-radius: 50%; content: ""; }
    .start-button:hover { transform: translateY(-3px); } .start-button:active { transform: translateY(1px); }
    .start-inner { display: flex; align-items: center; justify-content: center; gap: 24px; }
    .start-icon { width: 78px; height: 52px; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 5; }
    .start-label { font: 700 clamp(2.5rem,6vw,4rem)/1 "Kaiti SC", STKaiti, KaiTi, serif; letter-spacing: -.04em; }
    .routine-details { margin-top: 12px; color: var(--muted); line-height: 1.8; }
    summary { cursor: pointer; font-weight: 700; padding-block: 12px; }
    .routine-details ol { padding-left: 24px; margin: 8px 0; }
    .routine-details li { margin-bottom: 12px; }
    .running-panel { display: grid; gap: 20px; }
    .exercise-heading { font-size: 1.4rem; line-height: 1.5; overflow-wrap: anywhere; }
    .exercise-meta { margin-top: 6px; color: var(--muted); line-height: 1.6; }
    .scoreboard { position: relative; display: grid; grid-template-columns: minmax(180px,.8fr) minmax(240px,1fr); min-height: 300px; overflow: hidden; border-radius: var(--radius); background: var(--pool-deep); box-shadow: var(--shadow); color: var(--foam); }
    .scoreboard::after { position: absolute; right: -48px; bottom: -48px; width: 172px; height: 172px; border: 28px solid rgba(189,232,229,.12); border-radius: 50%; content: ""; pointer-events: none; }
    .running-panel.reveal .scoreboard { animation: scoreboard-in 500ms cubic-bezier(.16,1,.3,1) both; }
    .interval-state { display: flex; flex-direction: column; justify-content: space-between; gap: 24px; padding: 32px; background: var(--pool-dark); }
    .phase-name { color: var(--water); font: 700 2.7rem/1.15 "Kaiti SC", STKaiti, KaiTi, serif; letter-spacing: -.04em; }
    .action-name { font-size: 1.1rem; font-weight: 700; line-height: 1.6; margin-top: 14px; }
    .position-copy { color: #d9eeee; font-size: 1.1rem; font-weight: 700; line-height: 1.5; }
    .clock-field { display: grid; align-content: center; justify-items: center; min-width: 0; padding: 36px 24px; text-align: center; }
    .countdown { font: 800 6rem/.9 "Avenir Next Condensed", "DIN Condensed", "Arial Narrow", sans-serif; font-variant-numeric: tabular-nums; letter-spacing: -.04em; }
    .countdown-unit { margin-top: 18px; color: var(--water); font-size: .92rem; font-weight: 800; }
    .next-cue { margin-top: 16px; color: #d9eeee; font-size: .95rem; line-height: 1.6; }
    .clock-field .control { position: relative; z-index: 1; margin-top: 20px; }
    .clock-field .control:focus-visible { outline-color: var(--foam); }
    .scoreboard[data-state="ready"] .countdown { font-size: 3rem; }
    .lane-progress { display: grid; grid-template-columns: auto 1fr; gap: 12px 16px; align-items: center; padding: 4px; }
    .lane-label { color: var(--muted); font-size: .82rem; font-weight: 800; white-space: nowrap; }
    .lane-cells { display: grid; grid-template-columns: repeat(6,minmax(0,1fr)); gap: 7px; }
    .lane-cell { height: 12px; border: 1px solid #659da0; border-radius: 999px; background: var(--foam); }
    .lane-cell[data-state="complete"] { border-color: var(--pool); background: var(--pool); }
    .lane-cell[data-state="active"] { border-color: var(--signal-dark); background: var(--signal); transform: scaleY(1.5); }
    .running-actions, .running-controls { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; }
    .running-actions { justify-content: space-between; }
    .sound-controls { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
    .audio-status { color: var(--danger); font-size: .9rem; line-height: 1.6; }
    .control { min-height: 52px; padding: 12px 22px; border: 1px solid var(--pool); border-radius: 999px; font-weight: 700; line-height: 1.5; background: var(--water); color: var(--pool-dark); }
    .control:hover { background: #d7f3f1; border-color: var(--pool-deep); }
    .control:active { transform: translateY(1px); }
    .control.primary { background: var(--signal); border-color: var(--signal-dark); }
    .control.primary:hover { background: #fa8454; }
    .control.danger { background: var(--foam); color: var(--danger); border-color: #6e9da0; }
    .control.danger:hover { background: #fff3f0; border-color: var(--danger); }
    .notice { line-height: 1.65; }
    .notice { padding: 12px 0; color: var(--danger); font-weight: 700; }
    .reset-confirm { border-top: 1px solid var(--line); padding-top: 16px; }
    .reset-confirm p { margin-bottom: 12px; line-height: 1.6; }
    .calendar-section { border-top: 1px solid var(--line); padding-top: 26px; margin-bottom: 30px; }
    .calendar-top { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px 20px; }
    .calendar-top h2 { font-size: 1.35rem; }
    .calendar-top p { color: var(--muted); font-size: .95rem; line-height: 1.6; }
    .calendar-nav { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 18px 0 12px; }
    .calendar-nav .control { min-height: 44px; padding: 8px 14px; font-size: .9rem; }
    .month-title { font-size: 1.15rem; text-align: center; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7,minmax(0,1fr)); gap: 6px; }
    .weekday { color: var(--muted); font-size: .85rem; padding: 8px 0; text-align: center; }
    .calendar-day { min-height: 58px; padding: 7px 2px; display: grid; justify-items: center; align-content: center; gap: 3px; border-radius: 8px; border: 1px solid transparent; font-variant-numeric: tabular-nums; }
    .calendar-day[data-complete="true"] { background: var(--pool); color: white; }
    .calendar-day[aria-current="date"] { border: 2px solid var(--pool-dark); }
    .calendar-day small { font-size: .7rem; line-height: 1.3; }
    .page-footer { display: grid; gap: 10px; padding: 18px 4px 0; border-top: 1px solid var(--line); }
    .foreground-reminder { font-size: .95rem; font-weight: 700; line-height: 1.6; }
    .foreground-reminder strong { color: var(--signal-dark); }
    .local-note { font-size: .86rem; line-height: 1.65; color: var(--muted); }
    .debug-badge { margin-bottom: 16px; padding: 10px 14px; border: 1px solid var(--pool); color: var(--pool-deep); font-weight: 700; line-height: 1.6; }
    @keyframes scoreboard-in {
      from { clip-path: inset(0 100% 0 0 round var(--radius)); filter: blur(7px); transform: translateX(-20px); }
      to { clip-path: inset(0 0 0 0 round var(--radius)); filter: blur(0); transform: translateX(0); }
    }
    @media (max-width: 700px) {
      body::before, body::after { width: 10px; background-size: 10px 24px; background-image: radial-gradient(circle,var(--signal) 0 3px,transparent 3.5px); }
      .app-shell { width: calc(100% - 40px); padding-top: max(18px,env(safe-area-inset-top)); }
      .site-header { gap: 12px; align-items: center; padding-bottom: 16px; }
      .site-header h1 { font-size: 1.85rem; }
      .stage-progress { gap: 5px; margin-bottom: 22px; }
      .stage-number { width: 38px; height: 38px; }
      .stage-label { font-size: .75rem; } .stage-status { font-size: .7rem; }
      .start-button { min-height: 120px; }
      .start-icon { width: 44px; height: 36px; }
      .start-inner { gap: 14px; }
      .start-label { font-size: 2.4rem; }
      .scoreboard { grid-template-columns: 1fr; min-height: 0; }
      .interval-state { padding: 22px; gap: 18px; }
      .phase-name { font-size: 2.4rem; }
      .clock-field { padding: 26px 22px; }
      .countdown { font-size: 5.5rem; }
      .exercise-heading { font-size: 1.15rem; }
      .running-controls { width: 100%; }
      .control { padding-inline: 18px; }
      .calendar-day { min-height: 54px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="site-header">
      <h1>康复训练计时器</h1>
    </header>
    <main>
      <p class="debug-badge" id="debugBadge" hidden></p>
      <ol class="stage-progress" id="stageProgress" aria-label="五项训练进度，仅展示，不可跳项"></ol>
      <section id="idlePanel" aria-label="开始训练">
          <button class="start-button" id="startButton" type="button">
            <span class="start-inner">
              <svg class="start-icon" viewBox="0 0 90 56" aria-hidden="true"><path d="M4 29h10l6-17 10 34 10-27 10 20 8-12h28" fill="none"/></svg>
              <span class="start-label">开始训练</span>
            </span>
          </button>
      </section>
      <section class="running-panel" id="runningPanel" aria-label="当前训练" hidden>
        <div><h2 class="exercise-heading" id="exerciseName"></h2><p class="exercise-meta" id="exerciseMeta"></p></div>
        <div class="scoreboard">
          <div class="interval-state">
            <div><p class="phase-name" id="phaseName"></p><p class="action-name" id="actionName"></p></div>
            <p class="position-copy" id="positionCopy"></p>
          </div>
          <div class="clock-field">
            <p class="countdown" id="countdown"></p><p class="countdown-unit" id="countdownUnit"></p><p class="next-cue" id="nextCue"></p>
            <button class="control primary" id="continueButton" type="button" hidden>继续训练</button>
          </div>
        </div>
        <div class="lane-progress" id="laneProgress" aria-label="当前项组次进度"></div>
        <div class="running-actions">
          <div class="running-controls">
            <button class="control" id="pauseButton" type="button" hidden>暂停</button>
            <button class="control" id="skipPrepButton" type="button" hidden>跳过准备</button>
            <button class="control" id="skipRestButton" type="button" hidden>跳过休息</button>
            <button class="control danger" id="resetButton" type="button">结束 / 重新开始</button>
            <button class="control" id="retrySaveButton" type="button" hidden>重试保存打卡</button>
          </div>
        </div>
        <div class="reset-confirm" id="resetConfirm" hidden>
          <p>结束本次？未完成不打卡，历史保留。</p>
          <div class="running-controls"><button class="control danger" id="confirmResetButton" type="button">确认结束本次</button><button class="control" id="cancelResetButton" type="button">保留进度</button></div>
        </div>
      </section>
      <div class="sound-controls" aria-label="声音控制">
        <button class="control" id="soundButton" type="button" aria-pressed="true">声音：开</button>
        <button class="control" id="testSoundButton" type="button">试听声音</button>
        <p class="audio-status" id="audioStatusText" role="status" hidden></p>
      </div>
      <audio id="cueAudio" preload="auto" playsinline src="audio/prepare.wav" hidden></audio>
      <details class="routine-details"><summary>动作详情</summary><ol id="routineList"></ol></details>
      <p class="notice" id="runtimeMessage" role="status" hidden></p>
      <p class="notice" id="compatibilityMessage" role="status" hidden></p>
      <p class="notice" id="storageMessage" role="status" hidden></p>
    </main>
    <section class="calendar-section" aria-labelledby="calendarTitle">
      <div class="calendar-top"><h2 id="calendarTitle">训练日历</h2><p id="weeklySummary"></p></div>
      <div class="calendar-nav">
        <button class="control" id="prevMonth" type="button" aria-label="上一个月">上月</button>
        <h3 class="month-title" id="monthTitle" aria-live="polite"></h3>
        <button class="control" id="nextMonth" type="button" aria-label="下一个月">下月</button>
      </div>
      <div class="calendar-grid" id="calendarGrid" role="list" aria-label="本月日期"></div>
    </section>
    <footer class="page-footer">
      <p class="foreground-reminder"><strong>请勿锁屏或切 App。</strong>离开即暂停。</p>
      <p class="local-note">记录仅存本浏览器，清除网站数据会丢失。</p>
    </footer>
  </div>
  <script id="rehab-core">
    /* Dependency-free domain code. Tests execute this exact script, not a copy. */
    globalThis.RehabCore = (() => {
      "use strict";
      const VERSION = 1;
      const PROGRAM = "five-stage-v1";
      const stages = [
        { name: "俯卧左大腿屈膝后伸抗阻静力训练", equipment: "1 kg", short: "大腿后伸" },
        { name: "左侧直抬腿", equipment: "1 kg", short: "直抬腿" },
        { name: "左髋内收抗阻静力训练", equipment: "弹力带 15 磅", short: "髋内收" },
        { name: "左踝内翻训练", equipment: "弹力带 15 磅", short: "踝内翻" },
        { name: "左小腿踮脚静力训练 → 左小腿拉伸", equipment: "", short: "踮脚 / 拉伸" }
      ];
      const makePlan = () => {
        const plan = [{ stage: 0, kind: "prep", seconds: 30 }];
        for (let stage = 0; stage < 4; stage++) {
          for (let group = 1; group <= 2; group++) {
            for (let rep = 1; rep <= 6; rep++) {
              plan.push({ stage, group, rep, kind: "work", seconds: 15 });
              if (rep < 6) plan.push({ stage, group, rep, kind: "rest", seconds: 5 });
            }
            if (group === 1) plan.push({ stage, group, rep: 6, kind: "group-rest", seconds: 60 });
          }
        }
        for (let round = 1; round <= 4; round++) {
          plan.push({ stage: 4, round, kind: "work", action: "左小腿踮脚静力训练", seconds: 30 });
          plan.push({ stage: 4, round, kind: "stretch", action: "左小腿拉伸", seconds: 30 });
        }
        return plan.map((item, index) => Object.freeze({ ...item, index }));
      };
      const plan = Object.freeze(makePlan());
      const localDate = date => `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,"0")}-${String(date.getDate()).padStart(2,"0")}`;
      const validDate = value => {
        if (typeof value !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
        const [y,m,d] = value.split("-").map(Number);
        return localDate(new Date(y,m-1,d,12)) === value;
      };
      const validId = id => typeof id === "string" && /^[\w-]{8,100}$/.test(id);
      const validRecord = r => Boolean(r && r.version === VERSION && validId(r.id) && validDate(r.date) && typeof r.finishedAt === "string" && Number.isFinite(Date.parse(r.finishedAt)));
      const monthCells = (year, month, records, today) => {
        const marked = new Set(records.map(r => r.date));
        const first = new Date(year,month,1,12);
        const cells = Array((first.getDay()+6)%7).fill(null);
        const count = new Date(year,month+1,0,12).getDate();
        for (let day = 1; day <= count; day++) {
          const date = localDate(new Date(year,month,day,12));
          cells.push({ day, date, complete: marked.has(date), today: date === localDate(today) });
        }
        return cells;
      };
      const weeklyCount = (records, today) => {
        const start = new Date(today.getFullYear(),today.getMonth(),today.getDate(),12);
        start.setDate(start.getDate()-(start.getDay()+6)%7);
        const end = new Date(start); end.setDate(end.getDate()+7);
        return records.filter(r => r.date >= localDate(start) && r.date < localDate(end)).length;
      };
      class Engine {
        constructor(unitMs = 1000) { this.unitMs = unitMs; this.reset(); }
        reset() { this.state = "idle"; this.id = null; this.index = 0; this.remaining = 30*this.unitMs; this.deadline = null; this.lastNow = null; this.resumeState = "cue"; this.completion = null; this.reason = ""; }
        get interval() { return plan[this.index]; }
        start(id) { if (this.state !== "idle" || !validId(id)) return false; this.id = id; this.state = "cue"; return true; }
        arm(now) { if (this.state !== "cue") return false; this.state = "running"; this.deadline = now+this.remaining; this.lastNow = now; return true; }
        tick(now, date = new Date()) {
          if (this.state !== "running") return null;
          // A throttled callback never catches up through unseen/unperformed intervals.
          // Freeze at the last observed instant, including when the audio clock stops.
          const boundaryGrace = Math.min(1000, 2*this.unitMs);
          if (now < this.lastNow || now-this.lastNow > 1500 || now-this.deadline > boundaryGrace) {
            this.pause(this.lastNow); this.reason = "计时延迟，已暂停。"; return "late";
          }
          this.lastNow = now;
          this.remaining = Math.max(0,this.deadline-now);
          if (now < this.deadline) return null;
          const old = this.interval;
          if (this.index === plan.length-1) {
            this.state = "finished";
            this.completion = { version: VERSION, id: this.id, date: localDate(date), finishedAt: date.toISOString() };
            return "finished";
          }
          this.index++;
          this.remaining = this.interval.seconds*this.unitMs;
          if (this.interval.stage !== old.stage) { this.state = "ready"; this.deadline = null; return "ready"; }
          if (old.kind === "prep") { this.state = "cue"; this.deadline = null; return "cue"; }
          this.deadline += this.remaining;
          this.remaining = Math.max(0,this.deadline-now);
          return "interval";
        }
        pause(now) {
          if (!["running","cue"].includes(this.state)) return false;
          this.resumeState = this.state;
          if (this.state === "running") {
            // Do not count a gap since the last heartbeat as performed training.
            const safeNow = Math.min(now,this.lastNow+1500,this.deadline);
            this.remaining = Math.max(1,this.deadline-safeNow);
          }
          this.state = "paused"; this.deadline = null; return true;
        }
        continue() {
          if (!["paused","ready"].includes(this.state)) return false;
          this.state = "cue"; this.reason = ""; return true;
        }
        skip(kind, now) {
          if (this.state !== "running" || this.interval.kind !== kind || !["prep","group-rest"].includes(kind)) return false;
          // Revalidate at the click's timestamp, so a stale control cannot skip work.
          const result = this.tick(now);
          if (result || this.state !== "running" || this.interval.kind !== kind) return false;
          this.index++; this.remaining = this.interval.seconds*this.unitMs; this.state = "cue"; this.deadline = null; return true;
        }
        snapshot() {
          if (this.state === "idle") return null;
          return { version: VERSION, program: PROGRAM, unitMs: this.unitMs, id: this.id, index: this.index, remaining: this.remaining, state: this.state, completion: this.completion };
        }
        restore(s) {
          if (!s || s.version !== VERSION || s.program !== PROGRAM || s.unitMs !== this.unitMs || !validId(s.id) || !Number.isInteger(s.index) || !plan[s.index] || !Number.isFinite(s.remaining) || s.remaining < 0 || s.remaining > plan[s.index].seconds*this.unitMs || !["cue","running","paused","ready","finished"].includes(s.state)) return false;

        const line = document.createElement("li"); line.textContent=`${stage.name}${stage.equipment?`，${stage.equipment}`:""}。${i<4?"15 秒训练 / 5 秒重复间休息，6 次 × 2 组；组间休息 60 秒。":"踮脚 30 秒接拉伸 30 秒为一轮，共 4 轮，无额外休息。"}`; $("routineList").append(line);
      });
      if (isTest) { $("debugBadge").hidden=false; text("debugBadge",isDebug?`隔离测试 · ${unitMs} ms/秒 · 无声音`:"隔离测试 · 真实秒长与声音"); }
      const snapshot = store.loadProgress();
      if (snapshot !== null) {
        if (!engine.restore(snapshot)) showMessage("storageMessage","进度无法恢复，历史保留。");
        else {
          const existing = history.find(record => record.id===engine.id);
          if (existing) {
            engine.index=plan.length-1; engine.remaining=0; engine.state="finished"; engine.completion=existing;
            savedCompletion=true; store.saveProgress(null);
          } else if (engine.state==="finished") finishSave();
        }
      }
      render(); renderCalendar();
      // Read-only observability: no bypass/complete hooks in either production or test mode.
      window.__rehabTimer = {
        config: { debug:isDebug, test:isTest, unitMs, prefix, totalSeconds:plan.reduce((n,p)=>n+p.seconds,0) }, events,
        getPlan: () => plan.map(p=>({...p})),
        getState: () => ({ ...engine.snapshot(), runState:engine.state, savedCompletion, soundEnabled, mediaState:speaker.failed?"unavailable":$("cueAudio").paused?"paused":"playing", mediaJob:speaker.job?.key || null, pendingBeep, historyCount:history.length })
      };
    })();
  </script>
</body>
</html>
