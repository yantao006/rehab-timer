name: 验证
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  deterministic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 构建一致性、训练规则、存储与接口测试
        run: npm run validate
